icon_theme: "Papirus"
position: bottom
height: 40
popup_autohide: true

start:
  - type: "menu"
    label_icon: "distributor-logo-archlinux" 
    label_icon_size: 32
    label: null

  - type: "launcher"
    favorites:
      - "firefox"
      - "kitty"
      - "steam"
  - type: "workspaces"

center: []

end:
  - type: "battery"
    show_label: false
    justify: "center"


  - type: "clock"
    justify: "center"
    format: "%I:%M%P\n%d/%m/%y"

